name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deploya/api exec prisma generate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://deploya:deploya@localhost:5432/deploya
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate:mermaid

  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    env:
      # Binario oficial con checksum de gitleaks_8.30.1_checksums.txt; sin acciones de terceros.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar gitleaks con checksum verificado
        run: |
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${archivo}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archivo}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archivo}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archivo}" -C "${RUNNER_TEMP}" gitleaks
      - name: Escanear todo el historial
        run: >-
          "${RUNNER_TEMP}/gitleaks" detect --source .
          --config .gitleaks.toml --log-opts=--all --redact --no-banner

  smoke:
    name: Smoke compose
    runs-on: ubuntu-latest
    needs: build-test
    env:
      # El seed exige ADMIN_CLAVE (sin valor por defecto); en CI basta una de un solo uso.
      ADMIN_CLAVE: ci-${{ github.run_id }}-Aa#1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose up --build -d
      - name: Esperar health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health && curl -fsS http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1
      - run: API_URL=http://localhost:3001 WEB_URL=http://localhost:3000 node e2e/smoke.mjs
      - if: always()
        run: docker compose down -v
