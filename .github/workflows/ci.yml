name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deploya/api exec prisma generate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://deploya:deploya@localhost:5432/deploya
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate:mermaid

  smoke:
    name: Smoke compose
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose up --build -d
      - name: Esperar health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health && curl -fsS http://localhost:3000 >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1
      - run: API_URL=http://localhost:3001 WEB_URL=http://localhost:3000 node e2e/smoke.mjs
      - if: always()
        run: docker compose down -v
