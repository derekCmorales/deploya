# VPS (M6-02): se suma al de desarrollo, no lo reemplaza.
#   docker compose --env-file .env.vps -f docker-compose.yml -f docker-compose.vps.yml up -d --build
# (scripts/desplegar-vps.sh lo hace completo). Requiere Docker Compose 2.24 o más (`!reset` y `!override`).
# Los secretos viven solo en .env.vps del servidor; el ejemplo sin valores está en .env.vps.example.
services:
  # Sin puertos al exterior: solo la red interna de compose.
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.vps}
    ports: !reset []

  redis:
    ports: !reset []

  # Fuera del VPS: el correo sale por el proveedor SMTP (ADR 0001).
  mailpit:
    profiles: !override ["solo-desarrollo"]

  migracion:
    environment:
      CLIENTE_CLAVE: ${CLIENTE_CLAVE:?Define CLIENTE_CLAVE en .env.vps (distinta de ADMIN_CLAVE)}

  api:
    ports: !reset []
    volumes:
      # Solo lectura: la API muestra hasta cuándo vale el certificado (12b).
      - traefik_acme:/acme:ro
    environment:
      URL_WEB: https://${DOMINIO_BASE:?Define DOMINIO_BASE en .env.vps}
      # La API solo se alcanza por Traefik: `req.ip` sale de su X-Forwarded-For (límite de intentos, SP-17).
      PROXIES_DE_CONFIANZA: 1
      CLAVE_CIFRADO_VARIABLES: ${CLAVE_CIFRADO_VARIABLES:?Define CLAVE_CIFRADO_VARIABLES en .env.vps (32 bytes)}
      DOMINIO_BASE: ${DOMINIO_BASE}
      ESQUEMA_PUBLICO: https
      CERT_RESOLVER: letsencrypt
      ACME_ARCHIVO: /acme/acme.json
      CORREO_ADAPTADOR: smtp
      SMTP_HOST: ${SMTP_HOST:?Define SMTP_HOST en .env.vps}
      SMTP_PORT: ${SMTP_PORT:?Define SMTP_PORT en .env.vps}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      CORREO_REMITENTE: ${CORREO_REMITENTE:?Define CORREO_REMITENTE en .env.vps}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

  worker:
    environment:
      CLAVE_CIFRADO_VARIABLES: ${CLAVE_CIFRADO_VARIABLES:?Define CLAVE_CIFRADO_VARIABLES en .env.vps (32 bytes)}
      DOMINIO_BASE: ${DOMINIO_BASE:?Define DOMINIO_BASE en .env.vps}
      ESQUEMA_PUBLICO: https
      CERT_RESOLVER: letsencrypt
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

  # La web se publica en la raíz: la URL de la API y el dominio de las apps se hornean al construir.
  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMINIO_BASE:?Define DOMINIO_BASE en .env.vps}
        NEXT_PUBLIC_DOMINIO_APPS: ${DOMINIO_BASE}
        NEXT_PUBLIC_ESQUEMA_APPS: https
    ports: !reset []

  traefik:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./infra/traefik/traefik.vps.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/plataforma.generada.yml:/traefik/dinamico/_plataforma.yml:ro
      - traefik_dinamico:/traefik/dinamico
      - traefik_acme:/acme
    environment:
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_CORREO:?Define ACME_CORREO en .env.vps}
      # Token del proveedor DNS con permiso SOLO sobre la zona de DOMINIO_BASE (Cloudflare por defecto).
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?Define CF_DNS_API_TOKEN en .env.vps}
    restart: unless-stopped

volumes:
  traefik_acme:
