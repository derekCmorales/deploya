services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deploya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deploya}
      POSTGRES_DB: ${POSTGRES_DB:-deploya}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deploya} -d ${POSTGRES_DB:-deploya}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - deploya_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # DB-01: aplica las migraciones y el seed idempotente (planes, admin y cliente de demo)
  # antes de que arranquen la API y el trabajador. ADMIN_CLAVE sale de .env (sin valor por defecto).
  migracion:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["sh", "-c", "export PATH=\"$$PWD/node_modules/.bin:$$PATH\" && prisma migrate deploy && prisma db seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-deploya}:${POSTGRES_PASSWORD:-deploya}@postgres:5432/${POSTGRES_DB:-deploya}
      ADMIN_CORREO: ${ADMIN_CORREO:-admin@deploya.app}
      ADMIN_CLAVE: ${ADMIN_CLAVE:?Define ADMIN_CLAVE en .env (cp .env.example .env)}
      CLIENTE_CLAVE: ${CLIENTE_CLAVE:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-deploya}:${POSTGRES_PASSWORD:-deploya}@postgres:5432/${POSTGRES_DB:-deploya}
      REDIS_URL: redis://redis:6379
      MOTOR_ADAPTADORES: docker
      # Correo (M10, ADR 0001): Mailpit en desarrollo; en el VPS, las credenciales del proveedor.
      CORREO_ADAPTADOR: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      CORREO_REMITENTE: Deploya <no-responder@deploya.localhost>
      URL_WEB: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-3001}:3000"
    depends_on:
      migracion:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Motor (ADR 0002): misma imagen que la API; el único proceso con docker.sock y git.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: deploya-worker
    command: ["node", "dist/trabajador.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-deploya}:${POSTGRES_PASSWORD:-deploya}@postgres:5432/${POSTGRES_DB:-deploya}
      REDIS_URL: redis://redis:6379
      MOTOR_ADAPTADORES: docker
      DOMINIO_APPS: ${DOMINIO_APPS:-localhost}
      ESQUEMA_APPS: ${ESQUEMA_APPS:-http}
      TRAEFIK_DINAMICO: /traefik/dinamico
      TRAEFIK_CONTENEDOR: deploya-traefik
      TRABAJADOR_CONTENEDOR: deploya-worker
      TRABAJADOR_CONCURRENCIA: ${TRABAJADOR_CONCURRENCIA:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik_dinamico:/traefik/dinamico
    depends_on:
      migracion:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Enrutador de borde (ADR 0005): <proyecto>.localhost en desarrollo.
  traefik:
    image: traefik:v3.3
    container_name: deploya-traefik
    ports:
      - "${APPS_PORT:-80}:80"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_dinamico:/traefik/dinamico

  # Bandeja de correo de desarrollo (ADR 0001): SMTP en 1025, interfaz en 8025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  deploya_pg:
  traefik_dinamico:
