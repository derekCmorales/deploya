schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  Deploya es un PaaS (NestJS + Next.js, monolito modular, PostgreSQL, Redis, Docker).
  Ciclo: Recepción → Construcción → Ejecución → Enrutamiento → Operación.
  Puertos DIP sin prefijo I: ContenedorPuerto, EnrutamientoPuerto, VerificacionEntornoPuerto,
  PasarelaPago, ProveedorFuente, CorreoPuerto.
  Estados de despliegue ≠ estados de suscripción §4.4.
  Nunca commits a main. Ramas feat/m<n>-<slug>. Conventional Commits feat(m1):.
  OpenSpec primero: /opsx-propose → apply → archive. Un spec por módulo en openspec/specs/.
  Dueños: Eddy M1/M10+CI; Javier M2/M9+Prisma; Eduardo M3/M7+UI; Derek M4/M5/M6+tools M8.
  Kit visual canónico: docs/kit-visual.md (Geist, tokens claro/oscuro, AppShell).
  Specs con UI en apps/web SHALL reutilizar ese kit; no inventar paleta.
  Las pantallas actuales validan el kit (mock). No implementar auth/pagos/motor reales.
  Español de la propuesta. No usar IPasarelaPago ni ISourceProvider.

rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a Non-goals section
    - Name the change feat/m<n>-<slug> and the owning module
  specs:
    - Write requirements in Spanish; SHALL/WHEN/THEN as in existing seeds
    - Do not introduce I-prefixed ports
    - UI in apps/web must reuse docs/kit-visual.md; do not invent palettes or a second shell
  tasks:
    - Break tasks into chunks a teammate can finish in one PR

operations:
  apply:
    guidance:
      - UI: reutilizar docs/kit-visual.md (shell, tokens, tema); no fingir otro look ni tratar los mocks como producto terminado
      - Keep module health endpoints working
  archive:
    guidance:
      - Summarize what landed in the main spec before finishing
